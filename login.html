<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page - TicketHub</title>

    <style>

        /* General Page Style */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 85% 40%,
                    #5140d9 0%,
                    transparent 45%
                ),
                linear-gradient(
                    120deg,
                    #111b38,
                    #252b70,
                    #30208a
                );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login Container */
        .login-container {
            background: rgba(255, 255, 255, 0.96);

            width: 350px;
            max-width: calc(100% - 60px);
            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);

            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Login Title */
        h2 {
            text-align: center;
            color: #171b3d;
            margin-top: 10px;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* Labels */
        label {
            display: block;
            margin-bottom: 10px;
            color: #252b50;
            font-weight: bold;
            font-size: 15px;
        }

        /* Input Fields */
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;

            border: 1px solid #ddd;
            border-radius: 7px;

            box-sizing: border-box;
            font-size: 14px;

            background: #ffffff;
        }

        /* Input Focus */
        input:focus {
            outline: none;
            border-color: #5140d9;

            box-shadow: 0 0 5px rgba(81, 64, 217, 0.3);
        }

        /* Login Button */
        button {
            width: 100%;
            padding: 13px;

            background: linear-gradient(
                90deg,
                #314acb,
                #5140d9
            );

            color: white;
            border: none;
            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        /* Button Hover */
        button:hover {
            background: linear-gradient(
                90deg,
                #2538a8,
                #3929b5
            );

            transform: translateY(-2px);
        }

        /* Sign Up Text */
        .signup-text {
            color: #252b50;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 5px;
            font-size: 14px;
        }

        /* Sign Up Link */
        .signup-text a {
            color: #314acb;
            text-decoration: none;
            font-weight: bold;
        }

        /* Sign Up Hover */
        .signup-text a:hover {
            color: #5140d9;
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <h2>Login</h2>

        <form>

            <label for="username">Username</label>

            <input
                type="text"
                id="Username"
                name="Username"
                placeholder="Enter your Username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <a href="index.html">login</a>

        </form>

        <p class="signup-text">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

    </div>

</body>

</html>
